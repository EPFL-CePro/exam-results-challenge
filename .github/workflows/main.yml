name: Test and deploy

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: "ghcr.io/${{ github.repository }}-web:latest"

# only run on push to main, or manually
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

# needed to write to the container registry
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Run Tests
      run: python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GitHub Container Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha # uses the cache generated during previous runs to speed up the build
          cache-to: type=gha,mode=max # saves the cache to GitHub

