name: Build and Push Docker Image

on:
  workflow_run:
    workflows: ["Tests"]
    branches: [main]
    types: 
      - completed
      
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: a-zurcher/exam-results-challenge:latest
          # uses cache to speed up the image build
          cache-from: type=gha
          cache-to: type=gha,mode=max
